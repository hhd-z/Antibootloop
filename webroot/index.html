<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Anti Bootloop</title>
<style>
/* ========== 1. MIUIX 0.9.4 COLOR TOKENS ========== */
:root {
  color-scheme: dark light;
  --font-sans: system-ui, -apple-system, "MiSans", "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
  --spring: cubic-bezier(0.22, 1, 0.36, 1);

  /* Miuix DarkColors */
  --bg: #000000;
  --surface: #1A1A1C;
  --card: #242427;
  --card-press: #2E2E32;
  --item-bg: #303034;
  --haze: #000000;
  --text: #F0F0F2;
  --sub: #8E8E93;
  --dim: #5C5C62;
  --divider: rgba(255, 255, 255, 0.07);

  --primary: #277AF7;
  --primary-fg: #FFFFFF;
  --primary-soft: rgba(39, 122, 247, 0.16);
  --sw-off: #404046;
  --sw-thumb: #FFFFFF;

  --green: #28C840;
  --green-soft: rgba(40, 200, 64, 0.16);
  --yellow: #FF9F0A;
  --yellow-soft: rgba(255, 159, 10, 0.16);
  --red: #FF453A;
  --red-soft: rgba(255, 69, 58, 0.16);

  /* Floating Blur Dock Tokens (Dark) */
  --dock-bg: #202024;
  --dock-border: rgba(255, 255, 255, 0.10);
  --dock-shadow: 0 3px 10px rgba(0, 0, 0, 0.45);
  --dock-pill: rgba(39, 122, 247, 0.18);

  --r-card: 18px;
  --r-inner: 13px;
  --r-btn: 14px;
  --r-pill: 999px;
}

@media (prefers-color-scheme: light) {
  :root {
    /* Miuix LightColors */
    --bg: #F7F7F7;
    --surface: #F0F0F2;
    --card: #FFFFFF;
    --card-press: #F2F2F5;
    --item-bg: #F0F0F3;
    --haze: #F7F7F7;
    --text: #121214;
    --sub: #78787E;
    --dim: #B0B0B8;
    --divider: rgba(0, 0, 0, 0.06);

    --primary: #3482FF;
    --primary-fg: #FFFFFF;
    --primary-soft: rgba(52, 130, 255, 0.12);
    --sw-off: #E0E0E6;
    --sw-thumb: #FFFFFF;

    --green: #1FC438;
    --green-soft: rgba(31, 196, 56, 0.12);
    --yellow: #F59300;
    --yellow-soft: rgba(245, 147, 0, 0.12);
    --red: #F53629;
    --red-soft: rgba(245, 54, 41, 0.12);

    /* Floating Blur Dock Tokens (Light) */
    --dock-bg: #FFFFFF;
    --dock-border: rgba(0, 0, 0, 0.07);
    --dock-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
    --dock-pill: rgba(52, 130, 255, 0.14);
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* ========== 2. BASE & MIUIX TOPAPPBAR ========== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--text);
  font: 15px/1.45 var(--font-sans);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; touch-action: manipulation; }
.term { overscroll-behavior: contain; }

.topbar {
  position: sticky; top: 0; z-index: 30;
  background: var(--haze);
  border-bottom: 0.5px solid var(--divider);
  padding: max(10px, env(safe-area-inset-top)) 16px 10px;
}
.topbar-in {
  max-width: 580px; margin: 0 auto;
  display: flex; align-items: center; gap: 12px;
}
.app-icon {
  width: 40px; height: 40px;
  border-radius: 12px;
  background: var(--primary); color: #FFFFFF;
  display: grid; place-items: center; flex-shrink: 0;
  box-shadow: 0 4px 12px var(--primary-soft);
}
.app-icon svg { width: 22px; height: 22px; }
.tb-titles { flex: 1; min-width: 0; }
.tb-name { font-weight: 700; font-size: 18px; letter-spacing: -0.2px; line-height: 1.2; }
.tb-sub { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sub); margin-top: 2px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
.dot.warn { background: var(--yellow); }
.dot.bad { background: var(--red); }

.miuix-icon-btn {
  width: 40px; height: 40px;
  border-radius: 12px; border: 0;
  background: var(--item-bg); color: var(--text);
  display: grid; place-items: center;
  cursor: pointer; transition: transform 0.15s var(--spring), background 0.15s;
}
.miuix-icon-btn svg { width: 19px; height: 19px; }
.miuix-icon-btn:active { transform: scale(0.91); background: var(--card-press); }
.miuix-icon-btn.spin svg { animation: rot 0.55s linear; }
@keyframes rot { to { transform: rotate(360deg); } }

.container {
  max-width: 580px; margin: 0 auto;
  padding: 12px 14px calc(102px + env(safe-area-inset-bottom));
}

/* ========== 3. MIUIX CORE COMPONENTS ========== */
.small-title {
  font-size: 13px; font-weight: 600;
  color: var(--sub);
  padding: 10px 14px 6px; margin: 0;
  display: flex; align-items: center; justify-content: space-between;
}
.small-title:first-child { padding-top: 2px; }
.st-act {
  border: 0; background: transparent;
  color: var(--primary); font-size: 13px; font-weight: 600;
  padding: 4px 8px; margin: -4px -8px; border-radius: 8px;
  cursor: pointer; transition: opacity 0.15s;
}
.st-act:active { opacity: 0.6; }

.m-card {
  background: var(--card);
  border-radius: var(--r-card);
  padding: 16px; margin-bottom: 12px;
  overflow: hidden;
}
.m-card.list-card { padding: 4px 0; }

.m-pref {
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px; padding: 13px 16px; min-height: 58px;
  transition: background 0.15s, transform 0.15s var(--spring);
  position: relative;
}
.m-pref.clickable { cursor: pointer; }
.m-pref.clickable:active { background: var(--card-press); transform: scale(0.99); }
.m-pref + .m-pref::before {
  content: ""; position: absolute; top: 0; left: 16px; right: 16px;
  height: 0.5px; background: var(--divider);
}
.m-pref-body { flex: 1; min-width: 0; }
.m-pref-title { font-size: 15.5px; font-weight: 600; color: var(--text); line-height: 1.3; }
.m-pref-sum { font-size: 13px; color: var(--sub); margin-top: 3px; line-height: 1.4; }

/* Miuix Switch (50x28px) */
.m-sw {
  position: relative; width: 50px; height: 28px;
  flex-shrink: 0; display: inline-block; cursor: pointer;
}
.m-sw input {
  opacity: 0; position: absolute; inset: 0; margin: 0;
  width: 100%; height: 100%; z-index: 2; cursor: pointer;
}
.m-sw i {
  position: absolute; inset: 0;
  background: var(--sw-off);
  border-radius: var(--r-pill);
  transition: background 0.22s var(--spring);
}
.m-sw i::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--sw-thumb);
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.22);
  transition: transform 0.24s var(--spring);
}
.m-sw input:checked:active + i::after { transform: translateX(19px); }
.m-sw input:checked + i { background: var(--primary); }
.m-sw input:checked + i::after { transform: translateX(22px); background: var(--primary-fg); }

/* Miuix Button */
.m-btn {
  min-height: 46px; padding: 0 18px;
  border-radius: var(--r-btn); border: 0;
  background: var(--item-bg); color: var(--text);
  font-size: 15px; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  cursor: pointer; transition: transform 0.15s var(--spring), background 0.15s, opacity 0.15s;
}
.m-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
.m-btn.pri { background: var(--primary); color: var(--primary-fg); }
.m-btn.danger { background: var(--red-soft); color: var(--red); }
.m-btn.sm { min-height: 36px; padding: 0 13px; font-size: 13px; border-radius: 10px; }
.m-btn.full { width: 100%; }
.m-btn:active { transform: scale(0.97); opacity: 0.88; }

/* Miuix TabRow */
.m-tabrow {
  display: flex; gap: 4px;
  background: var(--item-bg);
  padding: 4px; border-radius: var(--r-inner);
}
.m-tabrow button {
  flex: 1; min-height: 40px; border: 0;
  border-radius: calc(var(--r-inner) - 3px);
  background: transparent; color: var(--sub);
  font-size: 14.5px; font-weight: 600;
  cursor: pointer; transition: background-color 0.2s, color 0.2s;
}
.m-tabrow button.on {
  background: var(--card); color: var(--text);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
}

/* Connection Error Banner */
.err-banner {
  display: none;
  background: var(--red-soft);
  border-radius: var(--r-card);
  padding: 14px 16px; margin-bottom: 12px;
  align-items: center; gap: 12px;
}
.err-banner.show { display: flex; }
.err-banner svg { width: 22px; height: 22px; color: var(--red); flex-shrink: 0; }
.err-banner .eb-txt { flex: 1; font-size: 13px; color: var(--text); line-height: 1.4; }
.err-banner .eb-txt b { display: block; font-size: 14px; color: var(--red); margin-bottom: 2px; }

.tab { display: none; animation: mFade 0.15s ease-out; }
.tab.on { display: block; }
@keyframes mFade { from { opacity: 0; } to { opacity: 1; } }

/* ========== 4. TAB 1: HERO, TIMELINE & TERMINAL ========== */
.hero-card { position: relative; overflow: hidden; }
.hero-card::after {
  content: ""; position: absolute; top: -45px; right: -45px;
  width: 150px; height: 150px; border-radius: 50%;
  background: radial-gradient(circle, var(--green) 0%, transparent 68%); opacity: 0.16;
  pointer-events: none;
}
.hero-card.warn::after { background: radial-gradient(circle, var(--yellow) 0%, transparent 68%); opacity: 0.2; }
.hero-card.bad::after { background: radial-gradient(circle, var(--red) 0%, transparent 68%); opacity: 0.24; }

.hero-main { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
.ring-box { position: relative; width: 78px; height: 78px; flex-shrink: 0; }
.ring-svg { width: 78px; height: 78px; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--item-bg); stroke-width: 7.5; }
.ring-fg {
  fill: none; stroke: var(--green); stroke-width: 7.5;
  stroke-linecap: round;
  stroke-dasharray: 201; stroke-dashoffset: 201;
  transition: stroke-dashoffset 0.5s var(--spring), stroke 0.3s;
}
.hero-card.warn .ring-fg { stroke: var(--yellow); }
.hero-card.bad .ring-fg { stroke: var(--red); }
.ring-ico {
  position: absolute; inset: 0;
  display: grid; place-items: center; color: var(--green);
}
.hero-card.warn .ring-ico { color: var(--yellow); }
.hero-card.bad .ring-ico { color: var(--red); }
.ring-ico svg { width: 28px; height: 28px; }

.hero-txt { flex: 1; min-width: 0; }
.hero-pill {
  display: inline-block; font-size: 11px; font-weight: 700;
  padding: 2px 9px; border-radius: var(--r-pill);
  background: var(--green-soft); color: var(--green);
  margin-bottom: 5px;
}
.hero-card.warn .hero-pill { background: var(--yellow-soft); color: var(--yellow); }
.hero-card.bad .hero-pill { background: var(--red-soft); color: var(--red); }
.hero-title { font-size: 19px; font-weight: 700; line-height: 1.25; }
.hero-meta { font-size: 12.5px; color: var(--sub); margin-top: 4px; }
.hero-meta b { color: var(--text); font-family: var(--font-mono); font-weight: 600; }

.stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat-cell {
  background: var(--item-bg);
  border-radius: var(--r-inner);
  padding: 12px 14px;
}
.stat-cell b { display: block; font-size: 22px; font-weight: 700; font-family: var(--font-mono); line-height: 1.15; }
.stat-cell span { font-size: 12px; color: var(--sub); }

/* Timeline */
.timeline { position: relative; padding-left: 18px; }
.timeline::before {
  content: ""; position: absolute; left: 5px; top: 8px; bottom: 8px;
  width: 1.5px; background: var(--divider);
}
.tl-item { position: relative; padding: 6px 0 14px 8px; font-size: 13.5px; }
.tl-item:last-child { padding-bottom: 2px; }
.tl-dot {
  position: absolute; left: -16.5px; top: 11px;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--primary);
}
.tl-item.trigger .tl-dot { background: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
.tl-item.timeout .tl-dot { background: var(--yellow); box-shadow: 0 0 0 3px var(--yellow-soft); }
.tl-item.systemui .tl-dot { background: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }

.tl-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 3px; }
.m-badge {
  font-size: 10px; font-weight: 700; padding: 2px 7px;
  border-radius: 6px; letter-spacing: 0.03em;
}
.m-badge.trigger { background: var(--red-soft); color: var(--red); }
.m-badge.timeout { background: var(--yellow-soft); color: var(--yellow); }
.m-badge.systemui { background: var(--primary-soft); color: var(--primary); }
.tl-time { color: var(--sub); font-size: 11.5px; font-family: var(--font-mono); }
.tl-desc { color: var(--text); line-height: 1.45; word-break: break-word; }

/* Dropdown & Terminal */
.sel-row { display: flex; gap: 8px; margin-bottom: 10px; }
.sel-wrap { position: relative; flex: 1; min-width: 0; }
.sel-wrap select {
  width: 100%; height: 42px; padding: 0 34px 0 13px;
  border-radius: var(--r-inner); border: 0;
  background: var(--item-bg); color: var(--text);
  font-size: 13.5px; font-weight: 600;
  appearance: none; -webkit-appearance: none; outline: none;
}
.sel-wrap svg {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; color: var(--sub); pointer-events: none;
}
.term-box {
  background: #0C0D10;
  border-radius: var(--r-inner);
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.07);
}
.term-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 12px; background: rgba(255, 255, 255, 0.04);
  font: 11px var(--font-mono); color: #8E8E93;
}
.term-dots { display: flex; gap: 5px; }
.term-dots i { width: 8px; height: 8px; border-radius: 50%; display: block; }
.term-dots i:nth-child(1) { background: #FF5F56; }
.term-dots i:nth-child(2) { background: #FFBD2E; }
.term-dots i:nth-child(3) { background: #27C93F; }
.term {
  padding: 11px 12px; max-height: 320px; overflow-y: auto;
  font: 12px/1.62 var(--font-mono); color: #E5E5EA;
  white-space: pre-wrap; word-break: break-word;
}
.term .l-err { color: #FF6961; font-weight: 600; }
.term .l-ok { color: #32D74B; }
.term .l-act { color: #FF9F0A; }
.term .l-hd { color: #64D2FF; font-weight: 700; }
.term .l-t { color: #636366; user-select: none; }

/* ========== 5. TAB 2: SEARCHBAR & MODULES ========== */
.m-search-wrap { position: relative; margin-bottom: 10px; }
.m-search-wrap svg.s-ico {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  width: 17px; height: 17px; color: var(--sub); pointer-events: none;
}
.m-search {
  width: 100%; height: 44px; padding: 0 38px 0 40px;
  border-radius: var(--r-pill); border: 0;
  background: var(--item-bg); color: var(--text);
  font-size: 14px; outline: none;
}
.m-search:focus { box-shadow: 0 0 0 2px var(--primary); }
.clr-q {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  width: 32px; height: 32px; border: 0; border-radius: 50%;
  background: transparent; color: var(--sub);
  display: none; place-items: center; cursor: pointer;
}
.clr-q.show { display: grid; }
.clr-q svg { width: 15px; height: 15px; }

.filter-pills { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; scrollbar-width: none; }
.filter-pills::-webkit-scrollbar { display: none; }
.f-pill {
  height: 34px; padding: 0 13px;
  border-radius: var(--r-pill); border: 0;
  background: var(--item-bg); color: var(--sub);
  font-size: 13px; font-weight: 600; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px;
  cursor: pointer; transition: background-color 0.18s, color 0.18s;
}
.f-pill.on { background: var(--primary); color: var(--primary-fg); }
.f-pill span { font-size: 11px; opacity: 0.85; font-family: var(--font-mono); }

.mod-row { padding: 13px 16px; position: relative; }
.mod-row + .mod-row::before {
  content: ""; position: absolute; top: 0; left: 68px; right: 16px;
  height: 0.5px; background: var(--divider);
}
.mod-row { content-visibility: auto; contain-intrinsic-size: auto 68px; }
.mod-main { display: flex; align-items: center; gap: 12px; }
.avatar {
  width: 40px; height: 40px; border-radius: 12px;
  display: grid; place-items: center;
  font-weight: 700; font-size: 16px; color: #FFF;
  flex-shrink: 0; text-transform: uppercase;
}
.mod-info { flex: 1; min-width: 0; }
.sw-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex: none; }
.sw-cap { font-size: 10.5px; line-height: 1.1; color: var(--sub); font-weight: 600; white-space: nowrap; }
.mod-nm-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.mod-nm { font-weight: 600; font-size: 15px; line-height: 1.25; word-break: break-word; }
.mod-id { color: var(--sub); font-size: 12px; font-family: var(--font-mono); margin-top: 2px; word-break: break-all; }
.tag { font-size: 10px; font-weight: 700; padding: 1.5px 6px; border-radius: 6px; }
.tag.on { background: var(--green-soft); color: var(--green); }
.tag.off { background: var(--red-soft); color: var(--red); }
.mod-act-row { margin-top: 9px; padding-left: 52px; }

.skel {
  height: 64px; margin: 6px 12px; border-radius: var(--r-inner);
  background: var(--item-bg); opacity: 0.6;
  animation: pulse 1.2s infinite ease-in-out;
}
@keyframes pulse { 50% { opacity: 0.3; } }

.how-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 11px 16px; font-size: 13.5px; line-height: 1.45;
  position: relative;
}
.how-item + .how-item::before {
  content: ""; position: absolute; top: 0; left: 48px; right: 16px;
  height: 0.5px; background: var(--divider);
}
.how-num {
  width: 22px; height: 22px; border-radius: 7px;
  background: var(--primary-soft); color: var(--primary);
  font-weight: 700; font-size: 12px; font-family: var(--font-mono);
  display: grid; place-items: center; flex-shrink: 0; margin-top: 1px;
}

.empty {
  color: var(--sub); text-align: center; padding: 28px 14px;
  font-size: 13.5px; display: flex; flex-direction: column; align-items: center; gap: 8px;
}

/* ========== 6. CLEAN FLOATING BLUR DOCK ========== */
.dock-wrap {
  position: fixed; left: 0; right: 0;
  bottom: calc(14px + env(safe-area-inset-bottom));
  z-index: 40;
  display: flex; justify-content: center;
  padding: 0 16px;
  pointer-events: none;
}
.floating-dock {
  pointer-events: auto;
  position: relative;
  width: 100%; max-width: 360px;
  height: 62px;
  padding: 5px;
  border-radius: var(--r-pill);
  background: var(--dock-bg);
  border: 1px solid var(--dock-border);
  box-shadow: var(--dock-shadow);
  display: grid; grid-template-columns: repeat(3, 1fr);
  align-items: center;
}
.dock-pill {
  position: absolute; top: 5px; bottom: 5px; left: 5px;
  width: calc((100% - 10px) / 3);
  border-radius: var(--r-pill);
  background: var(--dock-pill);
  transform: translate3d(calc(var(--idx, 0) * 100%), 0, 0);
  transition: transform 0.28s var(--spring);
  pointer-events: none; z-index: 0;
}
.floating-dock button {
  position: relative; z-index: 1;
  height: 100%; border: 0; border-radius: var(--r-pill);
  background: transparent; color: var(--sub);
  font-size: 11.5px; font-weight: 600;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  cursor: pointer; user-select: none;
  transition: color 0.2s, transform 0.15s var(--spring);
}
.floating-dock button svg { width: 20px; height: 20px; }
.floating-dock button:active { transform: scale(0.92); }
.floating-dock button.on { color: var(--primary); font-weight: 700; }

/* ========== 7. MIUIX WINDOW DIALOG & FULL-TEXT TOAST ========== */
.dialog-mask {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(0, 0, 0, 0.55);
  display: none; place-items: center; padding: 22px;
}
.dialog-mask.show { display: grid; animation: mFade 0.18s var(--spring); }
.m-dialog {
  width: 100%; max-width: 340px;
  background: var(--card);
  border-radius: 24px;
  padding: 22px 20px 18px;
  text-align: center;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
}
.m-dialog h3 { margin: 0 0 8px; font-size: 17px; font-weight: 700; }
.m-dialog p { margin: 0 0 20px; font-size: 14px; color: var(--sub); line-height: 1.45; }

/* Toast: Hiển thị đủ toàn bộ chữ, tự xuống dòng gọn đẹp */
#toast {
  position: fixed; left: 50%;
  bottom: calc(88px + env(safe-area-inset-bottom));
  transform: translate(-50%, 14px) scale(0.95);
  background: var(--dock-bg); color: var(--text);
  border: 1px solid var(--dock-border);
  padding: 10px 16px; border-radius: 16px;
  font-size: 13px; line-height: 1.4; font-weight: 600;
  text-align: center;
  opacity: 0; pointer-events: none;
  transition: transform 0.22s var(--spring), opacity 0.2s;
  width: max-content; max-width: calc(100vw - 32px);
  white-space: normal; word-break: break-word;
  box-shadow: var(--dock-shadow); z-index: 50;
}
#toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

    clearTimeout(toast._t); toast._t = setTimeout(function () { el.className = ""; }, 2200);
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function confirmBox(titleKey, descKey, isDanger, onYes) {
    $("mTitle").textContent = t(titleKey);
    $("mDesc").textContent = t(descKey);
    $("mOk").className = "m-btn " + (isDanger ? "danger" : "pri");
    $("modal").className = "dialog-mask show";
    $("mOk").onclick = function () { $("modal").className = "dialog-mask"; onYes(); };
  }
  $("mCancel").onclick = function () { $("modal").className = "dialog-mask"; };
  $("modal").onclick = function (e) { if (e.target === $("modal")) $("modal").className = "dialog-mask"; };

  function api(cmd) {
    return new Promise(function (resolve, reject) {
      if (window.ksu && typeof ksu.exec === "function") {
        var cb = "abl_cb_" + Date.now() + Math.floor(Math.random() * 1e6);
        window[cb] = function (code, out, err) {
          delete window[cb];
          if (code === 0) resolve(String(out || "").trim());
          else reject(new Error(err || out || "exec error"));
        };
        ksu.exec("sh " + MOD + "/api.sh " + cmd, "{}", cb);
      } else {
        if (!TOKEN) {
          var er = new Error(t("noToken"));
          er.i18nKey = "noToken";
          return reject(er);
        }
        fetch("cgi-bin/api", { method: "POST", headers: { "X-Token": TOKEN }, body: cmd, cache: "no-store" })
          .then(function (r) { return r.text(); })
          .then(function (x) { x = x.trim(); if (x.indexOf("ERR:") === 0) reject(new Error(x)); else resolve(x); })
          .catch(reject);
      }
    });
  }

  /* ---------- 4. LANGUAGE & RENDER ---------- */
  function getErrText() {
    return state.errKey ? t(state.errKey) : state.errRaw;
  }
  function applyStatic() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-i]"), function (el) {
      var v = t(el.getAttribute("data-i"));
      if (el.getAttribute("data-html")) el.innerHTML = v; else el.textContent = v;
    });
    document.documentElement.lang = state.lang;
    $("q").placeholder = t("search");
    $("tzHint").textContent = state.lang === "vi" ? I18N.vi.tzVi : I18N.en.tzEn;
    $("langHint").textContent = state.lang === "vi" ? I18N.vi.langHintVi : I18N.en.langHintEn;
    Array.prototype.forEach.call($("langSeg").children, function (b) {
      b.className = b.getAttribute("data-l") === state.lang ? "on" : "";
    });
    if (state.connErr) {
      $("errMsg").textContent = getErrText();
    }
  }
  function rerender() {
    applyStatic(); renderSettings(); renderStatus(); renderMods(); renderHist(); renderLogText(); renderLogSel();
  }
  Array.prototype.forEach.call($("langSeg").children, function (b) {
    b.onclick = function () {
      var l = b.getAttribute("data-l"), prev = state.lang;
      if (l === prev) return;
      state.lang = l;
      try { localStorage.setItem("abl_lang", l); } catch (e) {}
      rerender();
      api("set lang " + l).then(function () {
        toast(t("toLang"));
      }).catch(function (e) {
        state.lang = prev;
        try { localStorage.setItem("abl_lang", prev); } catch (x) {}
        rerender();
        toast(e.i18nKey ? t(e.i18nKey) : e.message);
      });
    };
  });

  /* ---------- 5. FLOATING DOCK TABS ---------- */
  var dock = $("dock");
  var navBtns = dock.querySelectorAll("button");
  Array.prototype.forEach.call(navBtns, function (b) {
    b.onclick = function () {
      Array.prototype.forEach.call(navBtns, function (x) { x.className = ""; });
      Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (x) { x.className = "tab"; });
      b.className = "on";
      dock.style.setProperty("--idx", b.getAttribute("data-idx") || "0");
      $("tab-" + b.getAttribute("data-t")).className = "tab on";
      window.scrollTo(0, 0);
    };
  });

  /* ---------- 6. STATUS HERO ---------- */
  function renderStatus() {
    var dot = $("dot"), hero = $("heroCard"), title = $("heroTitle"), ico = $("heroIcon");

    if (state.connErr) {
      $("sCount").textContent = "–";
      $("sThr").textContent = state.threshold;
      $("sLast").textContent = "–";
      $("ringFg").style.strokeDashoffset = "201";
      dot.className = "dot bad";
      hero.className = "m-card hero-card bad";
      $("hstat").textContent = t("connErr");
      title.textContent = t("connErr");
      ico.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
      return;
    }

    $("sCount").textContent = state.count;
    $("sThr").textContent = state.threshold;
    $("sLast").textContent = state.last === "none" ? t("never") : fmtTs(state.last);

    var ratio = state.threshold > 0 ? Math.min(1, state.count / state.threshold) : 0;
    $("ringFg").style.strokeDashoffset = String(201 - ratio * 201);

    if (state.count === 0) {
      dot.className = "dot"; hero.className = "m-card hero-card";
      $("hstat").textContent = t("stable"); title.textContent = t("stable");
      ico.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>';
    } else if (state.count < state.threshold) {
      dot.className = "dot warn"; hero.className = "m-card hero-card warn";
      var w = t("warn", { c: state.count, t: state.threshold });
      $("hstat").textContent = w; title.textContent = w;
      ico.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
    } else {
      dot.className = "dot bad"; hero.className = "m-card hero-card bad";
      $("hstat").textContent = t("danger"); title.textContent = t("danger");
      ico.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
    }
  }

  /* ---------- 7. SETTINGS ---------- */
  function renderSettings() {
    var seg = $("seg"); seg.innerHTML = "";
    for (var i = 1; i <= 5; i++) {
      (function (n) {
        var b = document.createElement("button");
        b.type = "button"; b.textContent = n;
        if (n === state.threshold) b.className = "on";
        b.onclick = function () {
          api("set threshold " + n).then(function () {
            state.threshold = n; renderSettings(); renderStatus(); toast(t("toThr", { n: n }));
          }).catch(function (e) { toast(e.i18nKey ? t(e.i18nKey) : e.message); });
        };
        seg.appendChild(b);
      })(i);
    }
    $("rec").checked = state.recovery === 1;
    $("recHint").textContent = state.recovery === 1 ? t("recOn") : t("recOff");
  }
  $("rec").onchange = function (e) {
    var v = e.target.checked ? 1 : 0;
    api("set recovery " + v).then(function () {
      state.recovery = v; renderSettings(); toast(v ? t("toRecOn") : t("toRecOff"));
    }).catch(function (er) { toast(er.i18nKey ? t(er.i18nKey) : er.message); e.target.checked = !v; });
  };
  $("reset").onclick = function () {
    confirmBox("cfmResetTitle", "cfmResetDesc", false, function () {
      api("reset").then(function () { toast(t("toReset")); loadAll(); }).catch(function (e) { toast(e.i18nKey ? t(e.i18nKey) : e.message); });
    });
  };

  /* ---------- 8. MODULES ---------- */
  var COLORS = ["#3482FF", "#28C840", "#FF9F0A", "#AF52DE", "#FF375F", "#5856D6", "#00C7BE"];
  function avatarBg(id) {
    var h = 0; for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return COLORS[h % COLORS.length];
  }
  function updateCounts() {
    var tot = state.mods.length;
    var kept = state.mods.filter(function (m) { return m.wl; }).length;
    var off = state.mods.filter(function (m) { return !m.en; }).length;
    $("cntTotal").textContent = tot; $("cntKept").textContent = kept;
    $("cAll").textContent = tot; $("cKept").textContent = kept; $("cOff").textContent = off;
  }
  function renderMods() {
    updateCounts();
    var box = $("mods");
    if (!state.modsLoaded) return;
    if (state.connErr && !state.mods.length) {
      box.innerHTML = '<div class="empty"><span>' + esc(getErrText()) + '</span></div>';
      return;
    }
    var list = state.mods.filter(function (m) {
      if (state.modTab === "kept" && !m.wl) return false;
      if (state.modTab === "off" && m.en) return false;
      var q = state.filter;
      return !q || (m.name + " " + m.id).toLowerCase().indexOf(q) >= 0;
    });
    if (!list.length) {
      box.innerHTML = '<div class="empty"><span>' + esc(state.mods.length ? t("noMatch") : t("noMods")) + '</span></div>';
      return;
    }
    box.innerHTML = "";
    list.forEach(function (m) {
      var d = document.createElement("div"); d.className = "mod-row";
      var ch = (m.name || m.id || "?").trim().charAt(0);
      d.innerHTML =
        '<div class="mod-main">' +
          '<div class="avatar" style="background:' + avatarBg(m.id) + '">' + esc(ch) + '</div>' +
          '<div class="mod-info">' +
            '<div class="mod-nm-line"><span class="mod-nm">' + esc(m.name) + '</span>' +
            '<span class="tag ' + (m.en ? "on" : "off") + '">' + esc(m.en ? t("on") : t("off")) + '</span></div>' +
            '<div class="mod-id">' + esc(m.id) + ' · ' + esc(m.ver) + '</div>' +
          '</div>' +
          '<div class="sw-wrap"><span class="sw-cap">' + esc(t("keepLbl")) + '</span><label class="m-sw" title="' + esc(t("keepLbl")) + '"><input type="checkbox"' + (m.wl ? " checked" : "") + '><i></i></label></div>' +
        '</div>' +
        (m.en ? "" : '<div class="mod-act-row"><button class="m-btn sm" type="button">' + esc(t("enableOne")) + '</button></div>');

      d.querySelector("input").onchange = function (ev) {
        m.wl = ev.target.checked ? 1 : 0; updateCounts(); saveWhitelist();
      };
      var eb = d.querySelector(".m-btn");
      if (eb) eb.onclick = function () {
        api("enable " + m.id).then(function () { toast(t("toEnabled", { n: m.name })); loadAll(); })
          .catch(function (e) { toast(e.i18nKey ? t(e.i18nKey) : e.message); });
      };
      box.appendChild(d);
    });
  }
  var wlTimer = null;
  function saveWhitelist() {
    clearTimeout(wlTimer);
    wlTimer = setTimeout(doSaveWhitelist, 350);
  }
  function doSaveWhitelist() {
    var ids = state.mods.filter(function (m) { return m.wl; }).map(function (m) { return m.id; });
    api("setwl " + (ids.length ? ids.join(",") : "-"))
      .then(function () { toast(t("toWl")); })
      .catch(function (e) { toast(e.i18nKey ? t(e.i18nKey) : e.message); });
  }
  var qTimer = null;
  $("q").oninput = function (e) {
    var v = e.target.value.trim().toLowerCase();
    $("clrQ").className = v ? "clr-q show" : "clr-q";
    clearTimeout(qTimer);
    qTimer = setTimeout(function () { state.filter = v; renderMods(); }, 120);
  };
  $("clrQ").onclick = function () { $("q").value = ""; state.filter = ""; $("clrQ").className = "clr-q"; renderMods(); };
  Array.prototype.forEach.call($("modChips").children, function (c) {
    c.onclick = function () {
      Array.prototype.forEach.call($("modChips").children, function (x) { x.className = "f-pill"; });
      c.className = "f-pill on"; state.modTab = c.getAttribute("data-f"); renderMods();
    };
  });
  $("restore").onclick = function () {
    confirmBox("cfmRestoreTitle", "cfmRestoreDesc", false, function () {
      api("restore").then(function (n) { toast(t("toRestored", { n: n })); loadAll(); })
        .catch(function (e) { toast(e.i18nKey ? t(e.i18nKey) : e.message); });
    });
  };

  /* ---------- 9. HISTORY & LOGS ---------- */
  function renderHist() {
    var box = $("hist");
    var lines = state.rawHist.split("\n").filter(Boolean).reverse();
    if (!lines.length) {
      box.innerHTML = '<div class="empty"><span>' + esc(t("noHist")) + '</span></div>';
      return;
    }
    var names = { trigger: t("tBootloop"), timeout: t("tTimeout"), systemui: t("tSystemui") };
    var wrap = document.createElement("div"); wrap.className = "timeline";
    lines.forEach(function (l) {
      var p = l.split("|"), type = p[1] || "trigger", detail = trMsg(p.slice(2).join("|"));
      var d = document.createElement("div"); d.className = "tl-item " + esc(type);
      d.innerHTML =
        '<span class="tl-dot"></span>' +
        '<div class="tl-head"><span class="m-badge ' + esc(type) + '">' + esc(names[type] || type) + '</span>' +
        '<span class="tl-time">' + esc(fmtTs(p[0])) + '</span></div>' +
        '<div class="tl-desc">' + esc(detail) + '</div>';
      wrap.appendChild(d);
    });
    box.innerHTML = ""; box.appendChild(wrap);
  }
  $("clrHist").onclick = function () {
    confirmBox("cfmHistTitle", "cfmHistDesc", true, function () {
      api("clearhistory").then(function () { toast(t("toHist")); loadHist(); }).catch(function (e) { toast(e.i18nKey ? t(e.i18nKey) : e.message); });
    });
  };
  function loadHist() { return api("history").then(function (x) { state.rawHist = x; renderHist(); }).catch(function () {}); }

  function renderLogText() {
    var el = $("term");
    if (!state.rawLog) { el.textContent = t("emptyLog"); return; }
    el.innerHTML = state.rawLog.split("\n").map(function (l) {
      var c = "";
      if (/=====/.test(l)) c = "l-hd";
      else if (/!!!|lỗi|treo|không hoàn tất/i.test(l)) c = "l-err";
      else if (/Đã tắt|reboot|recovery/i.test(l)) c = "l-act";
      else if (/ổn định|hoàn tất|Giữ nguyên|Bật lại|Khôi phục/i.test(l)) c = "l-ok";
      var m = /^\[(\d\d):(\d\d):(\d\d)\](.*)$/.exec(l), h;
      if (m) h = '<span class="l-t">[' + fmtClock(m[1], m[2], m[3]) + ']</span>' + esc(trMsg(m[4]));
      else h = esc(trMsg(l));
      return c ? '<span class="' + c + '">' + h + '</span>' : h;
    }).join("\n");
    el.scrollTop = el.scrollHeight;
  }
  function loadLog(name) {
    $("termFileLbl").textContent = name || "boot.log";
    return api("log" + (name ? " " + name : "")).then(function (x) { state.rawLog = x; renderLogText(); })
      .catch(function (e) { $("term").textContent = e.i18nKey ? t(e.i18nKey) : e.message; });
  }
  var logFiles = [];
  function renderLogSel() {
    var sel = $("logSel"), prev = sel.value; sel.innerHTML = "";
    if (!logFiles.length) { sel.innerHTML = '<option value="">' + esc(t("noLog")) + '</option>'; return; }
    logFiles.forEach(function (p) {
      var o = document.createElement("option");
      var when = p[2] ? fmtEpoch(parseInt(p[2], 10) * 1000) : "";
      o.value = p[0];
      o.textContent = p[0].replace(".log", "") + (p[0] === state.curLog ? " " + t("thisBoot") : "") + (when ? " · " + when : "");
      sel.appendChild(o);
    });
    sel.value = prev && sel.querySelector('option[value="' + prev + '"]') ? prev : (state.curLog || sel.options[0].value);
    $("termFileLbl").textContent = sel.value || "boot.log";
  }
  function loadLogList() {
    return api("logs").then(function (x) {
      logFiles = x.split("\n").filter(Boolean).map(function (l) { return l.split("|"); });
      renderLogSel();
      return loadLog($("logSel").value);
    }).catch(function () {});
  }
  $("logSel").onchange = function (e) { loadLog(e.target.value); };
  $("copyLog").onclick = function () {
    var txt = $("term").innerText || state.rawLog || "";
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { toast(t("toCopied")); }).catch(function () {});
    } else {
      var ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta);
      ta.select(); try { document.execCommand("copy"); toast(t("toCopied")); } catch (e) {}
      document.body.removeChild(ta);
    }
  };

  /* ---------- 10. LOAD ALL ---------- */
  function parseSections(x) {
    var o = {}, cur = null;
    x.split("\n").forEach(function (l) {
      if (l.indexOf("@@") === 0) { cur = l.slice(2).trim(); o[cur] = []; }
      else if (cur) o[cur].push(l);
    });
    Object.keys(o).forEach(function (k) { o[k] = o[k].join("\n").trim(); });
    return o;
  }
  function loadAll() {
    var rb = $("refresh"); rb.className = "miuix-icon-btn spin";
    setTimeout(function () { rb.className = "miuix-icon-btn"; }, 550);

    // 1 lần gọi root duy nhất cho toàn bộ dữ liệu
    api("all").then(function (x) {
      var sec = parseSections(x);
      state.connErr = false; state.errKey = ""; state.errRaw = "";
      $("errBanner").className = "err-banner";

      var kv = {}; (sec.get || "").split("\n").forEach(function (l) { var i = l.indexOf("="); if (i > 0) kv[l.slice(0, i)] = l.slice(i + 1); });
      state.threshold = parseInt(kv.threshold, 10) || 3;
      state.recovery = kv.recovery === "0" ? 0 : 1;
      state.lang = kv.lang === "en" ? "en" : "vi";
      state.curLog = kv.current_log || "";
      state.count = parseInt(kv.count, 10) || 0;
      state.last = kv.last_trigger || "none";
      try { localStorage.setItem("abl_lang", state.lang); } catch (e) {}

      state.modsLoaded = true;
      state.mods = (sec.modules || "").split("\n").filter(Boolean).map(function (l) {
        var p = l.split("|");
        return { id: p[0], name: p[1] || p[0], ver: p[2] || "?", en: p[3] === "1", wl: p[4] === "1" };
      });
      state.rawHist = sec.history || "";
      logFiles = (sec.logs || "").split("\n").filter(Boolean).map(function (l) { return l.split("|"); });

      applyStatic(); renderSettings(); renderStatus(); renderMods(); renderHist(); renderLogSel();
      var sel = $("logSel").value;
      if (sel && sel !== state.curLog) { loadLog(sel); }       // đang xem file log cũ hơn: tải riêng file đó
      else { state.rawLog = sec.log || ""; renderLogText(); }
    }).catch(function (e) {
      state.connErr = true;
      state.errKey = e.i18nKey || "";
      state.errRaw = e.message || "";
      $("errMsg").textContent = getErrText();
      $("errBanner").className = "err-banner show";
      state.modsLoaded = true;
      renderStatus();
      renderMods();
      toast(getErrText());
    });
  }

  $("refresh").onclick = function () { loadAll(); toast(t("toRefresh")); };
  $("retryBtn").onclick = function () { loadAll(); };

  try {
    var sl = localStorage.getItem("abl_lang"); if (sl === "en" || sl === "vi") state.lang = sl;
  } catch (e) {}

  applyStatic();
  renderSettings();
  renderStatus();
  renderHist();
  renderLogSel();
  renderLogText();
  loadAll();
})();
</script>
</body>
</html>
